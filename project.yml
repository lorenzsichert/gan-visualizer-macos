name: GANVisualizer
options:
  bundleIdPrefix: com.jakobsichert
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  GANVisualizer:
    type: application
    platform: macOS
    sources:
      - path: GANVisualizer/Sources
      - path: GANVisualizer/Resources
      - path: GANVisualizer/Converter
        buildPhase: resources
        excludes:
          - ".venv-converter/**"
          - "__pycache__/**"
          - "*.pyc"
    settings:
      base:
        INFOPLIST_FILE: GANVisualizer/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jakobsichert.GANVisualizer
        PRODUCT_NAME: GANVisualizer
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: GANVisualizer/GANVisualizer.entitlements

schemes:
  GANVisualizer:
    build:
      targets:
        GANVisualizer: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
